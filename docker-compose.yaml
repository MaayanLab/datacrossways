x-kubernetes:
  name: dataxways

name: datacrossways

services:
  dataxways-frontend:
    x-kubernetes:
      annotations:
        maayanlab.cloud/ingress: https://testing.ihdh.io
    image: maayanlab/datacrossways-frontend:1.0.2-hardened
    platform: linux/amd64
    build:
      context: ./ihdh_frontend
      args:
        VITE_BASE_API_URL: /api
        PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost}
        TRUSTED_EDGE_PROXY_CIDR: ${TRUSTED_EDGE_PROXY_CIDR:-127.0.0.1/32}
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${HTTP_PORT:-80}:80"
    depends_on:
      dataxways-api:
        condition: service_healthy
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /var/cache/nginx:uid=101,gid=101,mode=0700
      - /var/run:uid=101,gid=101,mode=0700
      - /tmp:uid=101,gid=101,mode=0700
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    networks: [frontend]

  dataxways-api:
    x-kubernetes:
      annotations:
        maayanlab.cloud/ingress: https://testing.ihdh.io/api/
    image: maayanlab/datacrossways-api:1.0.2-hardened
    platform: linux/amd64
    build:
      context: ./datacrossways_api
    environment:
      DB_HOST: ${DB_HOST:-dataxways-postgres}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME:-datacrossways}
      DB_USER: ${DB_USER:-datacrossways}
      DB_SSLMODE: ${DB_SSLMODE:-prefer}
      DB_PASSWORD_FILE: /run/secrets/dataxways-postgres-password
      FLASK_SECRET_KEY_FILE: /run/secrets/dataxways-flask-secret-key
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost}
      DEVELOPMENT: ${DEVELOPMENT:-false}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-}
      S3_ADDRESSING_STYLE: ${S3_ADDRESSING_STYLE:-auto}
      MULTIPART_MAX_AGE_HOURS: ${MULTIPART_MAX_AGE_HOURS:-24}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_AUTH_URI: ${GOOGLE_AUTH_URI:-https://accounts.google.com/o/oauth2/auth}
      GOOGLE_TOKEN_URI: ${GOOGLE_TOKEN_URI:-https://oauth2.googleapis.com/token}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_FIRST_NAME: ${ADMIN_FIRST_NAME:-Admin}
      ADMIN_LAST_NAME: ${ADMIN_LAST_NAME:-User}
      COLLECTION_IMAGE_HOSTS: ${COLLECTION_IMAGE_HOSTS:-datacrosswayspublic.s3.amazonaws.com}
    depends_on:
      dataxways-postgres:
        condition: service_healthy
        required: false
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/api/stats', timeout=5)"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
      - /app/secrets:uid=10001,gid=10001,mode=0700
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    mem_limit: ${API_MEMORY_LIMIT:-1g}
    pids_limit: 256
    secrets: [dataxways-postgres-password, dataxways-flask-secret-key]
    networks: [frontend, backend]

  dataxways-postgres:
    image: postgres:16-alpine
    profiles: [local-db]
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-datacrossways}
      POSTGRES_USER: ${POSTGRES_USER:-datacrossways}
      POSTGRES_PASSWORD_FILE: /run/secrets/dataxways-postgres-password
    volumes:
      - dataxways-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    secrets: [dataxways-postgres-password]
    networks: [backend]

volumes:
  dataxways-postgres-data:
    x-kubernetes:
      size: 1Gi
      class: ceph-block

networks:
  frontend:
  backend:
    internal: true

secrets:
  dataxways-postgres-password:
    file: ${DB_PASSWORD_FILE:-./secrets/dataxways-postgres-password}
  dataxways-flask-secret-key:
    file: ${FLASK_SECRET_KEY_FILE:-./secrets/dataxways-flask-secret-key}
